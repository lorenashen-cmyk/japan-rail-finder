<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKday 日本鐵路・找列車</title>
<style>
:root{--b:#26BEC9;--bd:#0E7C85;--bs:#E6F8FA;--ink:#1F2D33;--ink2:#5E6E73;--ink3:#8A989C;--line:#DDE6E8;--bg:#F4F8F9;--o:#FF5B2E;--os:#FFF1EC}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 24px;min-height:780px}
.hero{background:linear-gradient(135deg,#26BEC9 0%,#3FCFC0 100%);border-radius:20px;padding:22px 18px 18px;margin-bottom:20px}
.hero h1{margin:0 0 14px;color:#fff;font-size:24px;font-weight:900;letter-spacing:.02em}

/* 搜尋卡 */
.box{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(10,80,90,.12);position:relative}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 16px 12px;font-size:15px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button svg{width:20px;height:20px;flex:none}
.tabs button[aria-selected="true"]{color:var(--bd);border-bottom-color:var(--b)}
.form{position:relative;padding:16px;display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:stretch}
.fld{position:relative;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 14px 10px;background:#fff;min-width:0;transition:border-color .15s}
.fld:hover,.fld[aria-expanded="true"]{border-color:var(--b)}
.fld .l{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.fld .v{display:block;width:100%;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;outline:0;background:transparent;padding:0;margin:0;font-family:inherit;color:var(--ink)}
.fld{cursor:text}
.fld .v::placeholder{color:var(--ink3);font-weight:400;opacity:1}
.fld:focus-within{border-color:var(--b)}
.fld .v.ph{color:var(--ink3);font-weight:400}
.swap{align-self:center;width:36px;height:36px;border-radius:50%;color:var(--b);display:flex;align-items:center;justify-content:center}
.swap:hover{background:var(--bs)}
.swap svg{width:20px;height:20px}
.go{background:var(--o);color:#fff;border-radius:12px;padding:0 26px;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;min-height:58px}
.go:hover{background:#F04A1C}
.go svg{width:20px;height:20px}
.hint{padding:0 16px 14px;font-size:12.5px;color:var(--ink3)}
.hint b{color:var(--bd);font-weight:700}

/* 下拉面板 */
.pop{position:absolute;left:16px;right:16px;top:calc(100% - 4px);z-index:20;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(10,50,60,.22);padding:16px;display:none;max-height:470px;overflow-y:auto;overscroll-behavior:contain}
.pop.on{display:block}
.pop h3{margin:14px 0 8px;font-size:13px;color:var(--ink2)}
.pop h3:first-of-type{margin-top:0}
.pop .close{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--ink3);z-index:2}
.pop .close:hover{background:var(--bg)}
.psearch{width:calc(100% - 38px);height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:12px;font-size:15px}
.psearch:focus{border-color:var(--b);outline:0}
.rts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 12px}
.rts button{text-align:left;padding:7px 4px;border-radius:8px;font-size:14px}
.rts button:hover,.rl button:hover{background:var(--bg)}
.chp{display:flex;flex-wrap:wrap;gap:8px}
.chp button{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;background:#fff}
.chp button:hover{border-color:var(--b)}
.chp button.tr{border-color:#BFE9ED;background:var(--bs);color:var(--bd);font-weight:700}
.chp button[aria-pressed="true"]{border-color:var(--b);background:var(--b);color:#fff}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 12px}
.rl button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:8px 8px;border-radius:8px;font-size:14px}
.rl button small{color:var(--ink3);font-size:12px;white-space:nowrap}
.rl button.tr b{color:var(--bd)}
.rl .badge{font-size:11px;font-weight:700;background:var(--bs);color:var(--bd);border-radius:4px;padding:0 6px;margin-right:6px}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;color:var(--bd);font-weight:700;font-size:13px}
.none{padding:10px 4px;color:var(--ink2)}

/* 結果 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 2px 12px}
.cnt{font-size:16px;font-weight:700}
.cnt b{color:var(--bd);font-size:20px}
.cnt span{font-weight:400;font-size:13px;color:var(--ink2);margin-left:6px}
.rst{margin-left:6px;border:1px solid var(--b);color:var(--bd);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#fff;vertical-align:middle}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;text-decoration:none;color:inherit;overflow:hidden;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 6px 20px rgba(17,60,70,.12);transform:translateY(-1px)}
.pic{position:relative;aspect-ratio:362/120;background:linear-gradient(135deg,#BFEFF2,#E6F8FA);overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic.noimg{display:flex;align-items:center;justify-content:center;padding:0 14px;text-align:center}
.pic.noimg.k-觀光列車{background:linear-gradient(135deg,#FFE7A8,#FFF6DD)}
.pic.noimg.k-特急{background:linear-gradient(135deg,#D5D3FF,#F0EFFF)}
.pic.noimg.k-新幹線{background:linear-gradient(135deg,#BFEFF2,#E6F8FA)}
.pic .ph{font-size:20px;font-weight:900;color:rgba(14,60,70,.28);letter-spacing:.04em}
.tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;background:#fff;color:var(--bd);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.tag.k-觀光列車{color:#7A5200}.tag.k-特急{color:#3B3A8F}
.bd{display:flex;flex-direction:column;flex:1;padding:14px 16px 14px}
.nm{margin:0;font-weight:700;font-size:17px;line-height:1.4;min-height:48px}
.du{font-size:13px;color:var(--ink3);margin:0 0 10px}
.tm{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:6px}
.tm span{display:flex;align-items:center;gap:6px}
.tm svg{width:14px;height:14px;color:var(--ink3)}
.tm b{font-weight:400;color:var(--ink)}
.px{margin-top:auto;padding-top:8px;text-align:right;font-size:12px;color:var(--ink2)}
.px b{font-size:20px;font-weight:700;color:var(--ink);margin:0 2px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:36px 12px;background:var(--bg);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty a{display:inline-block;margin-top:12px;border:1px solid var(--b);color:var(--bd);border-radius:999px;padding:7px 18px;font-weight:700;background:#fff;text-decoration:none}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 0}
.pager button{border:1px solid var(--b);color:var(--bd);background:#fff;border-radius:999px;padding:8px 20px;font-weight:700}
.pager button:disabled{border-color:var(--line);color:#C5CED1;cursor:default}
.pager span{font-size:13px;color:var(--ink2);min-width:90px;text-align:center}.pager span b{color:var(--ink)}
.note{font-size:12px;color:var(--ink3);margin:14px 0 0;text-align:center}


/* 觀光列車卡（比照 KKday 觀光列車全攻略頁） */
.filters{margin:0 16px;padding:12px 0 4px;border-top:1px solid var(--line)}
.filters .frow:last-child{margin-bottom:6px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.frow>.fl{flex:none;font-size:14px;font-weight:700;color:#212121;min-width:64px}
.chipr{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chipr::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid #D5D6DB;color:#212121;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:#26BEC9}
.chip.is-active{background:#26BEC9;border-color:#26BEC9;color:#fff}
.list.tl{grid-template-columns:repeat(2,1fr);gap:12px}
.tcard{display:flex;gap:16px;width:100%;padding:12px;background:#fff;border:1px solid #E6E9ED;border-radius:12px;text-decoration:none;color:inherit;transition:box-shadow .2s,background .2s}
.tcard:hover{background:#F0FAFB;box-shadow:0 2px 24px rgba(38,50,56,.12)}
.tc-media{position:relative;flex:0 0 auto;width:190px;min-height:160px;border-radius:8px;overflow:hidden;background:#E6E9ED}
.tc-img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.tc-media.noimg{display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center;background:linear-gradient(135deg,#D5D3FF,#F0EFFF)}
.ph2{font-size:18px;font-weight:900;color:rgba(14,60,70,.3);letter-spacing:.04em}
.ttag{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;background:#E6E9ED;color:#727272;font-size:14px;line-height:20px}
.ttag.st{background:#FFF8E1;color:#212121}.ttag.st svg{color:#FFB400}
.ic{width:14px;height:14px;flex:none}
.tc-body{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
.tc-title{margin:0;font-size:18px;line-height:26px;font-weight:700}
.tcard:hover .tc-title{color:#13A3B6}
.tc-ja{margin:-6px 0 0;font-size:14px;line-height:20px;color:#9C9DA0}
.tc-route{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:14px;line-height:20px;font-weight:500}
.tc-route .ic{color:#13A3B6;width:16px;height:16px}
.tc-via{color:#9C9DA0;font-weight:400}
.tc-hook{margin:0;font-size:14px;line-height:20px;color:#727272;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px}
.fact{display:inline-flex;align-items:flex-start;gap:4px;max-width:100%;padding:2px 8px;border-radius:4px;background:#F1F4F8;color:#727272;font-size:14px;line-height:20px}
.fact .ic{margin-top:3px;color:#9C9DA0}
.fact.ok{background:#F0FAFB;color:#13A3B6}.fact.ok .ic{color:#26BEC9}
.fact.part{background:#FFF8E1;color:#212121}.fact.part .ic{color:#FFB400}
.fact.no{color:#9C9DA0}
.fact.hint .ic{color:#FFB400}
.tc-cta{margin-top:auto;padding-top:8px;align-self:flex-end;display:inline-flex;align-items:center;gap:2px;color:#13A3B6;font-weight:500;font-size:14px}
.tcard:hover .tc-cta{text-decoration:underline}



/* 搜尋結果分隔與直達列 */
.sep{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 2px 0;font-size:14px;font-weight:700;color:var(--ink2)}
.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.sep.hit{color:var(--bd)}
.cta-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:12px;background:var(--bs);color:var(--bd);font-weight:700;text-decoration:none}
.cta-bar:hover{background:#d4f1f4}

/* 新幹線路線圖（參考 KKday「JR 新幹線點到點領取地圖」） */
.mapmodes{display:flex;gap:4px;background:#E6E9ED;border-radius:999px;padding:3px;margin:0 0 10px}
.mapmodes button{flex:1;border-radius:999px;padding:6px 8px;font-size:13px;font-weight:700;color:#727272}
.mapmodes button[aria-pressed="true"]{background:#fff;color:#13A3B6;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.shin{display:none}
.shin{display:inline}
.sline{display:none}
.sline.is-shown{display:inline}
.jmap.focus .rlabels{opacity:0}
.jmap.focus:not(.is-zoomed) .route.is-shown{display:inline}
.lg-train{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:11.5px;color:#5E6E73}
.lg-train i{width:14px;height:0;border-top:2px solid #13A3B6;border-radius:2px}
.sline{cursor:pointer}
.sl-line{fill:none;stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .15s,stroke-width .15s}
.sl-hit{fill:none;stroke:transparent;stroke-width:16px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.jmap.has-line .sline:not(.is-sel) .sl-line{opacity:.15}
.jmap.has-line .sline:not(.is-sel){pointer-events:none}
.sline.is-sel .sl-line{stroke-width:5px}
.sline:hover .sl-line{stroke-width:5px}
.sdot{fill:#fff;stroke-width:2px;vector-effect:non-scaling-stroke;cursor:pointer}
.sdot:hover{fill:#F0FAFB}
.slbl{font-size:calc(12px*var(--u));font-weight:700;fill:#212121;paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--u));stroke-linejoin:round;pointer-events:none}
.slbl.sub{font-weight:500;fill:#5E6E73}
.pin{fill:#FF5B2E;stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.pinl{font-size:calc(13px*var(--u));font-weight:900;fill:#C2410C;paint-order:stroke;stroke:#fff;stroke-width:calc(3.5px*var(--u));stroke-linejoin:round;pointer-events:none}
.shin-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.shin-legend[hidden],.stlist[hidden]{display:none}
.shin-legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid #D5D6DB;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:#fff}
.shin-legend button i{width:10px;height:10px;border-radius:50%;flex:none}
.shin-legend button.is-sel{border-color:#13A3B6;background:#F0FAFB;font-weight:700}
.stlist{margin-top:10px;padding:12px;background:#fff;border:1px solid #E6E9ED;border-radius:12px}
.stl-head{font-size:14px;font-weight:700;margin-bottom:8px}
.stl-head small{font-weight:400;color:var(--ink3);margin-left:6px}
.stlist .chp button{padding:2px 9px;font-size:12px;border-radius:999px}
.stlist .chp button.mj{font-weight:700}
.stl-tip{margin:8px 0 0;font-size:12px;color:var(--ink3)}
/* 地圖（比照 KKday 觀光列車全攻略頁） */
.explore{display:block}
.mapcol{display:none}
body.has-map .mapcol{display:block}
.map-box{position:relative;background:#F7FAFC;border-radius:8px;overflow:hidden;user-select:none}
.map-back{position:absolute;top:12px;left:12px;z-index:2;background:#fff;border:1px solid #D5D6DB;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#13A3B6;box-shadow:0 1px 4px rgba(38,50,56,.12)}
.map-back[hidden]{display:none}
.map-tip{position:absolute;left:0;right:0;bottom:0;margin:0;padding:18px 8px 7px;text-align:center;font-size:12px;color:#727272;pointer-events:none;background:linear-gradient(rgba(247,250,252,0),#F7FAFC 55%)}
.maptoggle{display:none;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 16px;margin:0 0 10px;border:1px solid #D5D6DB;border-radius:8px;background:#fff;font-size:14px;font-weight:700;color:#13A3B6}
.maptoggle svg{transition:transform .2s}
.mapcol.open .maptoggle svg{transform:rotate(180deg)}
.jmap{display:block;width:100%;height:100%;--u:1}
.pref{fill:#CEF0F3;stroke:#fff;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .2s}
.region{cursor:pointer;outline:none}
.region:hover .pref,.region.is-hover .pref,.region:focus-visible .pref{fill:#26BEC9}
.region:focus-visible .pref{stroke:#13A3B6;stroke-width:2px}
.jmap.is-zoomed .pref{fill:#E6E9ED}
.jmap.is-zoomed .region:hover .pref,.jmap.is-zoomed .region:focus-visible .pref{fill:#F0FAFB}
.jmap.is-zoomed .region.is-active .pref{fill:#CEF0F3}
.jmap.is-zoomed .region.is-active{cursor:default}
.rlabels{pointer-events:none;transition:opacity .2s}
.jmap.is-zoomed .rlabels{opacity:0}
.rlabel-t{font-size:calc(14px*var(--u));paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--u));stroke-linejoin:round;fill:#212121}
.rlabel-name{font-weight:700}
.rlabel-n{fill:#13A3B6;font-weight:500}
.rlabel.is-hover .rlabel-name{fill:#13A3B6}
.routes,.stations{transition:opacity .2s}
.jmap.is-moving .stations{opacity:0}
.route{display:none}
.route.is-shown{display:inline;cursor:pointer}
.route-line{fill:none;stroke:#26BEC9;stroke-opacity:.6;stroke-width:2px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:stroke-opacity .15s,stroke-width .15s}
.route-hit{fill:none;stroke:transparent;stroke-width:22px;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.jmap:not(.is-zoomed) .route-line{stroke:#13A3B6;stroke-opacity:.75}
.jmap.has-hot .route-line{stroke-opacity:.15}
.jmap.has-hot .route.is-hot .route-line{stroke:#13A3B6;stroke-opacity:1;stroke-width:4px}
.st-dot{fill:#fff;stroke:#13A3B6;stroke-width:2px;vector-effect:non-scaling-stroke}
.st-label{font-size:calc(12px*var(--u));font-weight:700;fill:#212121;paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--u));stroke-linejoin:round;pointer-events:none}
.tcard.is-hot{background:#F0FAFB;box-shadow:0 2px 24px rgba(38,50,56,.12)}
.tcard.is-flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px #13A3B6}100%{box-shadow:0 0 0 3px transparent}}
@media (min-width:900px){
  body.has-map .explore{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:16px;align-items:start}
  body.has-map .mapcol{grid-column:2;grid-row:1;position:sticky;top:12px}
  body.has-map .listcol{grid-column:1;grid-row:1;min-width:0}
  body.has-map .list.tl{grid-template-columns:1fr}
  .map-box{height:640px}
}
@media (max-width:899px){
  .map-tip{display:none}
  .maptoggle{display:flex}
  .map-box{display:none;height:380px;margin-bottom:12px}
  .mapcol.open .map-box{display:block}
}
@media (max-width:760px){
  .list.tl{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 36px 1fr}
  .form .go{grid-column:1/-1}
  .list{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:599px){
  .tcard{flex-direction:column;gap:12px}
  .tc-media{width:auto;min-height:0;aspect-ratio:16/10}
  .chip{height:32px;padding:0 12px}
  .frow>.fl{min-width:0}
}
@media (max-width:520px){
  .wrap{padding:12px 10px 20px;min-height:0}
  .hero{padding:16px 10px 10px;border-radius:16px;margin-bottom:16px}.hero h1{font-size:20px;margin-bottom:12px}
  .tabs button{flex-direction:column;gap:2px;padding:10px 4px 8px;font-size:13px}
  .tabs button svg{width:22px;height:22px}
  .form{padding:12px;gap:8px;grid-template-columns:1fr}
  .swap{position:absolute;right:24px;top:78px;transform:translateY(-50%) rotate(90deg);background:#fff;border:1px solid var(--line);z-index:3;width:34px;height:34px}
  .fld{padding:8px 12px 9px}.fld .v{font-size:15px}
  .go{min-height:50px}
  .hint{padding:0 12px 12px}
  .pop{left:8px;right:8px;max-height:420px;z-index:50;padding:14px 12px}

  .nm{min-height:40px;font-size:14px;line-height:1.4}
  .du{font-size:12px;margin-bottom:6px}
  .tm{font-size:11.5px;margin-bottom:3px}.tm svg{display:none}

  .chip{height:30px;padding:0 11px;font-size:13px}

/* 地圖精簡：全國圖只留區域名稱；路線只在放大區域或滑過列車時出現 */
.rlabel-n{display:none}
.map-tip{display:none!important}
.jmap:not(.is-zoomed):not(.has-hot) .route{display:none}
.jmap:not(.is-zoomed).has-hot .route:not(.is-hot){display:none}
.jmap:not(.is-zoomed) .route.is-hot{display:inline}
.jmap:not(.has-line) .sline[data-line=akita] .sl-line,.jmap:not(.has-line) .sline[data-line=yamagata] .sl-line,.jmap:not(.has-line) .sline[data-line=nkyushu] .sl-line{opacity:.55;stroke-width:2px}
.shin-legend{gap:5px}

.shin-legend button i{width:8px;height:8px}
.stl-more{margin-left:8px;border:0;background:none;color:var(--bd);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer}

/* 城市選擇與 2 張票組合 */
.cityrow{display:flex;align-items:stretch;border-radius:8px}
.cityrow:hover{background:var(--bg)}
.cityrow .cmain{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:8px;font-size:14px;font-weight:700}
.cityrow .cmain small{font-weight:400;color:var(--ink3);font-size:12px}
.cityrow .cmore{flex:none;padding:0 10px;font-size:12.5px;color:var(--bd);font-weight:700;white-space:nowrap}
.cityrow .cmore:hover{text-decoration:underline}
.combo-sep{color:#C2410C}.combo-sep small{font-weight:400;color:var(--ink3);margin-left:4px}
.tcard.combo{background:#FFFBF5;border-color:#FFE1CC}
.tcard.combo:hover{background:#FFF6EC}
.combo .tc-media.noimg{background:linear-gradient(135deg,#FFE3CF,#FFF4EA)}
.combo .ph2{color:rgba(194,65,12,.35)}
.tcard.combo .tc-media{width:120px}
.combo .tc-route{flex-wrap:nowrap;align-items:flex-start}
.combo .tc-route .ic{margin-top:2px;flex:none}
.combo .ttag{background:#FFF1EC;color:#C2410C}
.legs{display:flex;flex-direction:column;gap:6px}
.leg{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #FFD9BF;background:#fff;border-radius:8px;text-decoration:none;font-size:14px;color:inherit}
.leg:hover{background:#FFF1EC}
.leg .no{width:20px;height:20px;border-radius:50%;background:#FF5B2E;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.leg .lt{flex:1;min-width:0;font-weight:700}
.leg small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.leg b{color:#C2410C;white-space:nowrap;font-size:14px}
.tot{margin:2px 0 0;text-align:right;font-size:13px;color:var(--ink2)}
.tot b{font-size:18px;color:var(--ink)}
@media (max-width:599px){
  .tcard.combo .tc-media{display:none}
  .tcard.combo{padding:10px}
  .leg{padding:7px 8px;gap:6px;font-size:13px}.leg b{font-size:13px}
}

.tc-route .tc-via{color:#9C9DA0;font-weight:400}
.tcard .tc-facts{margin-top:0}
.tcard .tc-body{gap:6px}
.tcard .tc-ja{margin:-3px 0 0}

.tcard .tc-route{flex-wrap:nowrap;align-items:flex-start}

}

  svgEl.addEventListener('click',function(e){

  // ---- 新幹線路線圖 ----

  function findSt(name){var v=[name,name.replace('浜','濱'),name.replace('Gala','GALA')];for(var i=0;i<v.length;i++){if(ST[v[i]])return ST[v[i]];if(STS[v[i]])return STS[v[i]]}return null}

  // prices.json 格式：{"asof":"YYYY-MM-DD","items":{"<KKday 頁面路徑>":{"p":起價,"d":"H時MM分","a":"HHMM","z":"HHMM"}}}
